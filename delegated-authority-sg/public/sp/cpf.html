<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CPF Online Services</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family:'Inter',sans-serif; background:#f5f7fa; }
    .cpf-green { color:#005B94; }
    .cpf-header { background:linear-gradient(135deg,#005B94,#003d6b); }
    .card { background:white; border-radius:12px; border:1px solid #e2e8f0; padding:20px; margin-bottom:16px; }
    .balance-card { background:white; border-radius:12px; border:2px solid #005B94; padding:20px; text-align:center; }
    .blurred { filter:blur(6px); user-select:none; pointer-events:none; }
    .locked-overlay { position:relative; }
    .locked-badge { position:absolute; inset:0; background:rgba(249,250,251,0.85); border-radius:12px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; }
  </style>
</head>
<body>

<!-- CPF Header -->
<div class="cpf-header text-white">
  <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div style="background:white;border-radius:8px;padding:4px 10px;font-weight:800;color:#005B94;font-size:14px;letter-spacing:0.04em">CPF</div>
      <span class="text-sm font-medium opacity-90">Online Services</span>
    </div>
    <div id="user-badge" class="text-xs opacity-75"></div>
  </div>
</div>

<!-- Delegated access banner (shown when delegated) -->
<div id="delegated-banner" style="display:none;background:#fffbeb;border-bottom:2px solid #f59e0b">
  <div class="max-w-4xl mx-auto px-6 py-3 flex items-center gap-3">
    <svg class="w-4 h-4 text-amber-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:16px;height:16px;color:#d97706"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    <div>
      <span style="font-size:12px;font-weight:700;color:#92400e">DELEGATED AUTHORITY — READ-ONLY · RESTRICTED SCOPE</span>
      <span id="delegated-banner-text" style="font-size:12px;color:#b45309;margin-left:8px"></span>
    </div>
  </div>
</div>

<div class="max-w-4xl mx-auto px-6 py-8" id="loading-state">
  <div class="flex items-center justify-center py-20">
    <div style="width:32px;height:32px;border:3px solid #bfdbfe;border-top-color:#005B94;border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <span class="ml-3 text-slate-500 text-sm">Authenticating via Singpass…</span>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>

<div class="max-w-4xl mx-auto px-6 py-8" id="main-content" style="display:none">

  <!-- Identity strip -->
  <div class="card" id="identity-card">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Logged in via Singpass</div>
        <div class="text-lg font-bold text-slate-800" id="user-name"></div>
        <div class="text-sm text-slate-500" id="user-nric"></div>
      </div>
      <div style="background:#eff6ff;border-radius:10px;padding:10px 14px;text-align:right">
        <div class="text-xs text-blue-500 font-semibold mb-1">Session scope</div>
        <div class="text-xs text-blue-700 font-medium" id="scope-label"></div>
      </div>
    </div>
  </div>

  <!-- CPF Balances -->
  <h2 class="text-base font-semibold text-slate-700 mb-4">CPF Account Balances</h2>
  <div id="cpf-balances" class="grid grid-cols-2 gap-4 mb-6"></div>

  <!-- Contributions section (own only) -->
  <div id="contributions-section" style="display:none">
    <h2 class="text-base font-semibold text-slate-700 mb-4">Recent Contributions</h2>
    <div class="card">
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr style="border-bottom:2px solid #f1f5f9">
            <th style="text-align:left;padding:8px 0;font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase">Month</th>
            <th style="text-align:right;padding:8px 0;font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase">Employer</th>
            <th style="text-align:right;padding:8px 0;font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase">Employee</th>
            <th style="text-align:right;padding:8px 0;font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase">Total</th>
          </tr>
        </thead>
        <tbody id="contributions-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Audit notice -->
  <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px;margin-top:8px">
    <div style="font-size:10px;color:#94a3b8;display:flex;align-items:center;gap-6px">
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="flex-shrink:0;color:#94a3b8"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      <span id="audit-notice" style="margin-left:6px"></span>
    </div>
  </div>
</div>

<div class="max-w-4xl mx-auto px-6 py-4 text-center" id="error-state" style="display:none">
  <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:32px;max-width:480px;margin:0 auto">
    <div class="text-red-600 font-semibold mb-2" id="error-title">Access Denied</div>
    <div class="text-red-500 text-sm" id="error-msg"></div>
    <a href="javascript:window.close()" style="display:inline-block;margin-top:16px;font-size:13px;color:#005B94">Close window</a>
  </div>
</div>

<script>
const fmt = n => new Intl.NumberFormat('en-SG',{style:'currency',currency:'SGD',minimumFractionDigits:2}).format(n);

const CPF_ACCOUNTS = [
  { key:'cpfOa', label:'Ordinary Account', sub:'Housing · Education · Investment', color:'#005B94' },
  { key:'cpfSa', label:'Special Account',  sub:'Retirement savings',              color:'#0369a1' },
  { key:'cpfMa', label:'MediSave Account', sub:'Healthcare · Insurance premiums',  color:'#065f46' },
  { key:'cpfRa', label:'Retirement Account',sub:'CPF LIFE payouts',               color:'#7c3aed' },
];

const MOCK_CONTRIBUTIONS = [
  { month:'Mar 2026', employer:1040, employee:800, total:1840 },
  { month:'Feb 2026', employer:1040, employee:800, total:1840 },
  { month:'Jan 2026', employer:1040, employee:800, total:1840 },
];

async function init() {
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) { showError('No session token', 'Please scan a QR code from the Singpass app to access this service.'); return; }

  const res = await fetch(`/api/sp-session/${token}`);
  if (!res.ok) {
    const e = await res.json();
    showError('Session expired or invalid', e.error || 'Please scan again from the Singpass app.');
    return;
  }

  const sess = await res.json();
  render(sess);
}

function render(sess) {
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';

  const { persona, isDelegated, scopes } = sess;
  const data = persona.data;

  document.getElementById('user-badge').textContent = isDelegated ? 'Delegated Authority Session' : 'Authenticated';
  document.getElementById('user-name').textContent = persona.name;
  document.getElementById('user-nric').textContent = persona.nric + (persona.age ? ` · Age ${persona.age}` : '');
  document.getElementById('scope-label').textContent = isDelegated ? 'MediSave only' : 'Full CPF access';

  if (isDelegated) {
    document.getElementById('delegated-banner').style.display = 'block';
    document.getElementById('delegated-banner-text').textContent =
      `Viewing MediSave balance for ${persona.name} only. OA, SA and RA balances are not accessible under delegated authority.`;
    document.getElementById('audit-notice').textContent =
      `This delegated access has been logged. Both you and ${persona.name} can view this activity in Singpass Inbox.`;
    renderDelegatedBalances(data);
  } else {
    document.getElementById('audit-notice').textContent =
      `This session is secured by Singpass. Your activity on CPF Online Services is logged.`;
    renderFullBalances(data);
    renderContributions();
  }
}

function renderFullBalances(data) {
  const balances = document.getElementById('cpf-balances');
  balances.innerHTML = CPF_ACCOUNTS.map(a => {
    const val = data[a.key] ?? 0;
    return `<div class="balance-card" style="border-color:${a.color}">
      <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">${a.label}</div>
      <div style="font-size:24px;font-weight:800;color:${a.color};margin-bottom:4px">${fmt(val)}</div>
      <div style="font-size:10px;color:#94a3b8">${a.sub}</div>
    </div>`;
  }).join('');
  document.getElementById('contributions-section').style.display = 'block';
}

function renderDelegatedBalances(data) {
  const balances = document.getElementById('cpf-balances');
  balances.style.gridTemplateColumns = '1fr';

  // MediSave — visible
  const ma = data.cpfMa ?? 0;
  const maHtml = `
    <div class="balance-card" style="border-color:#065f46;grid-column:1/-1">
      <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">MediSave Account</div>
      <div style="font-size:32px;font-weight:800;color:#065f46;margin-bottom:4px">${fmt(ma)}</div>
      <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">Available for healthcare payments &amp; insurance premiums</div>
      <div style="background:#f0fdf4;border-radius:8px;padding:10px;font-size:11px;color:#166534;text-align:left">
        Can be used to pay:<br>
        · MediShield Life premiums · Integrated Shield Plan premiums<br>
        · Approved hospital bills · Day surgery charges
      </div>
    </div>`;

  // Other accounts — locked
  const locked = CPF_ACCOUNTS.filter(a => a.key !== 'cpfMa').map(a => `
    <div style="position:relative;background:white;border-radius:12px;border:1px solid #e2e8f0;padding:20px;text-align:center;overflow:hidden">
      <div style="filter:blur(5px);user-select:none">
        <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">${a.label}</div>
        <div style="font-size:24px;font-weight:800;color:#e2e8f0">$XX,XXX.XX</div>
      </div>
      <div style="position:absolute;inset:0;background:rgba(249,250,251,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <svg width="16" height="16" fill="none" stroke="#9ca3af" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        <span style="font-size:10px;color:#9ca3af;font-weight:600">Not accessible</span>
        <span style="font-size:9px;color:#9ca3af">${a.label}</span>
      </div>
    </div>`).join('');

  balances.style.gridTemplateColumns = '1fr 1fr';
  balances.innerHTML = `<div style="grid-column:1/-1">${maHtml}</div>` + locked;
}

function renderContributions() {
  document.getElementById('contributions-section').style.display = 'block';
  const tbody = document.getElementById('contributions-body');
  tbody.innerHTML = MOCK_CONTRIBUTIONS.map(c => `
    <tr style="border-bottom:1px solid #f8fafc">
      <td style="padding:10px 0;font-size:13px;color:#374151">${c.month}</td>
      <td style="text-align:right;padding:10px 0;font-size:13px;color:#374151">${fmt(c.employer)}</td>
      <td style="text-align:right;padding:10px 0;font-size:13px;color:#374151">${fmt(c.employee)}</td>
      <td style="text-align:right;padding:10px 0;font-size:13px;font-weight:600;color:#005B94">${fmt(c.total)}</td>
    </tr>`).join('');
}

function showError(title, msg) {
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('error-state').style.display = 'block';
  document.getElementById('error-title').textContent = title;
  document.getElementById('error-msg').textContent = msg;
}

init();
</script>
</body>
</html>
